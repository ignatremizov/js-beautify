name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - chore/npm-audit-refresh-20261022


jobs:
  build:
    name: Build ${{ matrix.os }} (Node ${{ matrix.node-version }}, Python ${{ matrix.python-version }} )
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu, windows, macos ]
        python-version: ['3.10', 3.11]
        node-version: ['24.22.1']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package*.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Set up pinned repository-local npm
        shell: bash
        run: ./tools/npm --version
      - name: Make all (Windows)
        if: matrix.os == 'windows'
        run: make all
      - name: Make CI (Non-windows)
        if: matrix.os != 'windows'
        run: make ci
